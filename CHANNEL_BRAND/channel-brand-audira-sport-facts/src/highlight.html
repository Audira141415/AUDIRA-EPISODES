<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B3D2E}
body{position:relative;background:radial-gradient(circle at 50% 50%,#0f4a38 0%,#0B3D2E 55%,#072a20 100%);font-family:'Space Grotesk',sans-serif}
svg{position:absolute;left:240px;top:660px}
p{position:absolute;left:0;right:0;top:1330px;text-align:center;color:#A3E635;font-weight:700;font-size:72px;letter-spacing:2px}
</style></head><body>
<!-- Instagram highlight cover: icon inside the centre circle crop. ?k=bola|basket|badminton|balap|data -->
<svg id="ic" width="600" height="600" viewBox="-300 -300 600 600" fill="none" stroke-linecap="round" stroke-linejoin="round"></svg>
<p id="lb"></p>
<script>
const k=new URLSearchParams(location.search).get('k')||'bola';
const T='#00B894',O='#FF6A3D',Wt='#FFFFFF',sw=14;
const ring=`<circle r="280" stroke="${T}" stroke-opacity=".55" stroke-width="8"/>`;
const icons={
  bola:['SEPAK BOLA',(()=>{let g=`<circle r="150" stroke="${Wt}" stroke-width="${sw}"/>`;const p=[];for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;p.push([52*Math.cos(a),52*Math.sin(a)]);}
    g+=`<path d="M${p.map(q=>q.join(' ')).join('L')}Z" fill="${O}" stroke="${O}" stroke-width="${sw}"/>`;for(const a of p)g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${a[0]*2.85}" y2="${a[1]*2.85}" stroke="${Wt}" stroke-width="${sw}"/>`;return g;})()],
  basket:['BASKET',`<circle r="150" stroke="${Wt}" stroke-width="${sw}"/><g stroke="${O}" stroke-width="${sw}"><line y1="-150" y2="150"/><line x1="-150" x2="150"/><path d="M-106 -106 Q -30 0 -106 106"/><path d="M106 -106 Q 30 0 106 106"/></g>`],
  badminton:['BADMINTON',`<g stroke="${Wt}" stroke-width="${sw}"><path d="M-70 -150 L-28 60 M70 -150 L28 60 M0 -165 L0 60 M-70 -150 Q0 -190 70 -150 M-50 -50 H50"/></g><path d="M-40 60 H40 V90 Q40 150 0 150 Q-40 150 -40 90 Z" fill="${O}"/>`],
  balap:['BALAP',`<g stroke="${Wt}" stroke-width="${sw}"><line x1="-120" y1="-150" x2="-120" y2="160"/></g>`+(()=>{let g='';for(let r=0;r<4;r++)for(let c=0;c<4;c++)g+=`<rect x="${-120+c*55}" y="${-150+r*45}" width="55" height="45" fill="${(r+c)%2?Wt:O}"/>`;return g;})()],
  data:['ANALISIS',`<g stroke="${Wt}" stroke-width="${sw}"><path d="M-150 150 H150"/></g><rect x="-130" y="40" width="60" height="100" fill="${T}"/><rect x="-30" y="-30" width="60" height="170" fill="${T}"/><rect x="70" y="-120" width="60" height="260" fill="${O}"/><path d="M-100 0 L0 -80 L100 -170" stroke="${Wt}" stroke-width="${sw}"/>`],
};
const [label,body]=icons[k];
document.getElementById('ic').innerHTML=ring+body;
document.getElementById('lb').textContent=label;
</script>
</body></html>
