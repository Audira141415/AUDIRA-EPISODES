<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--forest:#0B3D2E;--forest-deep:#072a20;--tosca:#00B894;--lime:#A3E635;--orange:#FF6A3D;--white:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2560px;height:1440px;overflow:hidden;background:var(--forest)}
body{position:relative;font-family:'Space Grotesk',sans-serif;color:var(--white)}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 1400px 700px at 50% 50%,#0f4a38 0%,var(--forest) 55%,var(--forest-deep) 100%)}
svg.globe{position:absolute;top:50%;transform:translateY(-50%)}
.ticker{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,184,148,.35) 20%,rgba(0,184,148,.35) 80%,transparent)}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px}
.row{display:flex;align-items:center;gap:52px}
.row img{height:118px;display:block}
.divider{width:4px;height:136px;background:var(--tosca);border-radius:2px}
.title{display:flex;flex-direction:column;gap:6px}
.title h1{font-weight:700;font-size:134px;line-height:.9;letter-spacing:-3px}
.title h1 span{color:var(--orange)}
.title p{font-weight:500;font-size:33px;color:var(--lime);letter-spacing:.5px}
.chips{display:flex;gap:22px}
.chips div{font-weight:500;font-size:26px;padding:10px 24px;border:2px solid rgba(255,255,255,.28);border-radius:999px;color:rgba(255,255,255,.92)}
.chips div b{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tosca);margin-right:12px;vertical-align:middle;position:relative;top:-2px}
</style></head><body>
<div class="bg"></div>
<!-- wireframe globes outside the safe area (visible on TV/desktop) -->
<svg class="globe" style="left:-260px" width="760" height="760" viewBox="-100 -100 200 200" fill="none" stroke="#00B894" stroke-opacity=".22" stroke-width=".5">
  <circle r="95"/><ellipse rx="95" ry="32"/><ellipse rx="95" ry="64"/><line x1="-95" x2="95"/>
  <ellipse rx="32" ry="95"/><ellipse rx="64" ry="95"/><line y1="-95" y2="95"/>
</svg>
<svg class="globe" style="right:-260px" width="760" height="760" viewBox="-100 -100 200 200" fill="none" stroke="#A3E635" stroke-opacity=".16" stroke-width=".5">
  <circle r="95"/><ellipse rx="95" ry="32"/><ellipse rx="95" ry="64"/><line x1="-95" x2="95"/>
  <ellipse rx="32" ry="95"/><ellipse rx="64" ry="95"/><line y1="-95" y2="95"/>
  <circle cx="38" cy="22" r="4" fill="#FF6A3D" fill-opacity=".8" stroke="none"/>
</svg>
<div class="ticker" style="top:452px"></div>
<div class="ticker" style="top:986px"></div>
<div class="safe">
  <div class="row">
    <img src="horizontal-reversed.svg" alt="audira multimedia digital">
    <div class="divider"></div>
    <div class="title"><h1>Explained<span>.</span></h1><p>Berita Indonesia &amp; dunia, dibedah visual</p></div>
  </div>
  <div class="chips">
    <div><b></b>Hukum &amp; Politik</div>
    <div><b></b>Dunia &amp; Dampaknya</div>
    <div><b></b>Angka di Balik Berita</div>
    <div><b></b>Riset &amp; Sumber Jelas</div>
  </div>
</div>
</body></html>
