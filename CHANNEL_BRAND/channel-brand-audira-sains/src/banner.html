<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--forest:#0B3D2E;--forest-deep:#072a20;--tosca:#00B894;--lime:#A3E635;--orange:#FF6A3D;--white:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:var(--forest)}
body{position:relative;font-family:'Space Grotesk',sans-serif;color:var(--white)}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 55% 50% at 50% 50%,#0f4a38 0%,var(--forest) 55%,var(--forest-deep) 100%)}
/* lab notebook grid, very faint */
.grid{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 2px,transparent 2px 80px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 2px,transparent 2px 80px)}
.sky{position:absolute;inset:0;
  -webkit-mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.55) 22%,transparent 37%,transparent 63%,rgba(0,0,0,.55) 78%,#000 100%);
          mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.55) 22%,transparent 37%,transparent 63%,rgba(0,0,0,.55) 78%,#000 100%)}
.art{position:absolute;top:50%}
.tag{position:absolute;font-family:'JetBrains Mono',monospace;font-weight:500;color:rgba(163,230,53,.8);letter-spacing:1px;white-space:nowrap;transform:translate(-50%,-50%)}
.tag b{font-weight:700;color:var(--white);margin-right:12px}
.tag i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--orange);vertical-align:middle;margin-right:12px;position:relative;top:-2px}
.band{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(163,230,53,.32) 20%,rgba(163,230,53,.32) 80%,transparent)}
.safe{position:absolute;width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:38px;transform-origin:center}
.row{display:flex;align-items:center;gap:52px}
.row img{height:112px;display:block}
.divider{width:4px;height:136px;background:var(--tosca);border-radius:2px}
.title{display:flex;flex-direction:column;gap:18px}
.title h1{font-weight:700;font-size:132px;line-height:.9;letter-spacing:-3px;white-space:nowrap}
.title h1 span{color:var(--orange)}
.title p{font-weight:500;font-size:33px;color:var(--lime);letter-spacing:.5px;white-space:nowrap}
.chips{display:flex;gap:20px}
.chips div{font-weight:500;font-size:26px;padding:10px 24px;border:2px solid rgba(255,255,255,.28);border-radius:999px;color:rgba(255,255,255,.92);white-space:nowrap}
.chips div b{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tosca);margin-right:14px;vertical-align:middle;position:relative;top:-2px}
</style></head><body>
<div class="bg"></div>
<div class="grid"></div>
<svg class="sky" id="sky"></svg>
<div class="band" id="b1"></div>
<div class="band" id="b2"></div>
<div class="safe" id="safe">
  <div class="row">
    <img src="horizontal-reversed.svg" alt="audira multimedia digital">
    <div class="divider"></div>
    <div class="title"><h1>Sains<span>.</span></h1><p>Kenapa &amp; bagaimana dunia bekerja. Bersumber.</p></div>
  </div>
  <div class="chips">
    <div><b></b>Biologi</div>
    <div><b></b>Fisika &amp; Kimia</div>
    <div><b></b>Bumi &amp; Alam</div>
    <div><b></b>Astronomi</div>
    <div><b></b>Materi Sekolah</div>
  </div>
</div>
<script>
// ?w=2560&h=1440&s=1&tags=1  (s = scale of the centred content block)
const q=new URLSearchParams(location.search);
const W=+(q.get('w')||2560),H=+(q.get('h')||1440),S=+(q.get('s')||1),TAGS=q.get('tags')!=='0';
document.documentElement.style.width=document.body.style.width=W+'px';
document.documentElement.style.height=document.body.style.height=H+'px';
const safe=document.getElementById('safe');
safe.style.left=(W-1546)/2+'px';safe.style.top=(H-423)/2+'px';safe.style.transform=`scale(${S})`;
const half=423*S/2+30*S;
document.getElementById('b1').style.top=(H/2-half)+'px';
document.getElementById('b2').style.top=(H/2+half)+'px';

// background: small star field + a faint sine wave across the frame, faded toward centre
const sky=document.getElementById('sky');sky.setAttribute('width',W);sky.setAttribute('height',H);
let rnd=7;const R=()=>(rnd=(rnd*16807)%2147483647)/2147483647;
let g='';
for(let i=0;i<Math.round(W*H/26000);i++){
  const r=(R()<.12?2.6:1.4)*Math.max(.7,S);
  g+=`<circle cx="${(R()*W).toFixed(1)}" cy="${(R()*H).toFixed(1)}" r="${r}" fill="${R()<.15?'#A3E635':'#FFFFFF'}" fill-opacity="${(.25+R()*.4).toFixed(2)}"/>`;
}
let d=`M0 ${H*.8}`;const amp=H*.06,per=W/3.2;
for(let x=0;x<=W;x+=8)d+=`L${x} ${(H*.8+amp*Math.sin(x/per*2*Math.PI)).toFixed(1)}`;
g+=`<path d="${d}" stroke="#00B894" stroke-opacity=".22" stroke-width="${Math.max(2,2.4*S)}" fill="none"/>`;
sky.innerHTML=g;

// line-art science icons on the outer edges (visible on TV/desktop, cropped on mobile)
function mk(cx,r){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('class','art');s.setAttribute('width',2*r+20);s.setAttribute('height',2*r+20);
  s.setAttribute('viewBox',`${-r-10} ${-r-10} ${2*r+20} ${2*r+20}`);
  s.style.left=(cx-r-10)+'px';s.style.marginTop=(-r-10)+'px';
  document.body.insertBefore(s,safe);return s;
}
function atom(cx,r){
  const s=mk(cx,r);
  let g=`<circle r="${r}" fill="#072a20" fill-opacity=".78" stroke="#00B894" stroke-opacity=".6" stroke-width="${3*S}"/>`;
  g+=`<g stroke="#00B894" stroke-opacity=".5" stroke-width="${2.4*S}" fill="none">`;
  for(const a of [0,60,120])g+=`<ellipse rx="${r*.8}" ry="${r*.3}" transform="rotate(${a})"/>`;
  g+=`</g>`;
  g+=`<circle r="${r*.13}" fill="#FF6A3D"/>`;
  g+=`<circle cx="${r*.8}" cy="0" r="${8*S}" fill="#A3E635"/>`;
  const e=r*.8*Math.cos(Math.PI/3), f=r*.8*Math.sin(Math.PI/3);
  g+=`<circle cx="${-e}" cy="${-f}" r="${8*S}" fill="#A3E635"/>`;
  g+=`<circle cx="${-e}" cy="${f}" r="${8*S}" fill="#FFFFFF" fill-opacity=".85"/>`;
  s.innerHTML=g;
}
function planet(cx,r){
  const s=mk(cx,r);
  let g=`<circle r="${r}" fill="#072a20" fill-opacity=".78" stroke="#00B894" stroke-opacity=".6" stroke-width="${3*S}"/>`;
  const p=r*.42;
  g+=`<g transform="rotate(-18)">`;
  g+=`<path d="M${-r*.82} 0 A${r*.82} ${r*.22} 0 0 0 ${r*.82} 0" stroke="#00B894" stroke-opacity=".5" stroke-width="${2.6*S}" fill="none"/>`;
  g+=`<circle r="${p}" fill="#0f4a38" stroke="#00B894" stroke-opacity=".55" stroke-width="${2.4*S}"/>`;
  g+=`<path d="M${-p*.9} ${-p*.3} H${p*.9} M${-p*.95} ${p*.15} H${p*.95}" stroke="#00B894" stroke-opacity=".35" stroke-width="${2*S}"/>`;
  g+=`<path d="M${-r*.82} 0 A${r*.82} ${r*.22} 0 0 1 ${-p*.98} ${r*.12}" stroke="#00B894" stroke-opacity=".5" stroke-width="${2.6*S}" fill="none"/>`;
  g+=`<path d="M${p*.98} ${r*.12} A${r*.82} ${r*.22} 0 0 1 ${r*.82} 0" stroke="#00B894" stroke-opacity=".5" stroke-width="${2.6*S}" fill="none"/>`;
  g+=`<path d="M${-r*.4} ${r*.2} A${r*.82} ${r*.22} 0 0 0 ${r*.4} ${r*.2}" stroke="#00B894" stroke-opacity=".5" stroke-width="${2.6*S}" fill="none"/>`;
  g+=`</g>`;
  // orange dashed orbit of a small moon
  g+=`<path d="M${-r*.7} ${-r*.5} Q ${r*.05} ${-r*1.0} ${r*.68} ${-r*.52}" fill="none" stroke="#FF6A3D" stroke-width="${3.5*S}" stroke-dasharray="${10*S} ${9*S}"/>`;
  g+=`<circle cx="${r*.68}" cy="${-r*.52}" r="${9*S}" fill="#FF6A3D"/>`;
  s.innerHTML=g;
}
const gut=W/2-735*S-24;
const Rb=Math.min(H*0.3,gut*0.4);
const cxL=gut/2, cxR=W-cxL;
atom(cxL,Rb);
planet(cxR,Rb);

// dated milestones as stat tags above/below each icon, tall canvases only
function tag(yr,txt,cx,y){
  const e=document.createElement('div');e.className='tag';
  e.style.fontSize='19px';e.style.top=y+'px';e.style.left=cx+'px';
  e.innerHTML=`<i></i><b>${yr}</b>${txt}`;document.body.insertBefore(e,safe);
}
if(H>=1000&&TAGS){
  tag('1869','TABEL PERIODIK',cxL,H/2-Rb-48);
  tag('1953','STRUKTUR DNA',cxL,H/2+Rb+48);
  tag('1687','HUKUM GRAVITASI',cxR,H/2-Rb-48);
  tag('1969','MENDARAT DI BULAN',cxR,H/2+Rb+48);
}
</script>
</body></html>
