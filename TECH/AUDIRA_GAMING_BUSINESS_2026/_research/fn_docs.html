 your search request\",\n  \"suggestions_title\": \"Did you mean...\",\n  \"title_search_in\": \"Search In\",\n  \"title_search_results\": \"Search Results\"\n}\n","h":{},"s":200,"st":"OK","u":"/documentation/assets/i18n/global/search/en-US.json","rt":"text"},"2606813388":{"b":{"id":61301,"hash_id":"1apQ","revision_hash_id":"0PmnKN","revision_id":5004308,"updated_at":"2026-10-21T21:00:09.586Z","slug":"engagement-payout-in-fortnite-creative","title":"Engagement Payout","description":"Make islands and get rewarded! Learn more about how engagement payouts work for you.","source":"epic_developer_community","locale":"en-us","document_type":"concept","seo_title":"Engagement Payout in Fortnite Creative","seo_description":"Make islands and get rewarded! Learn more about how engagement payouts work for you in Fortnite.","seo_slug":"engagement-payout-in-fortnite-creative","readiness":"production","entitlement":"none","views_count":102620,"thumbnail_image":{"id":23215296,"file_name":"engagement-topic.png","file_size":268506,"content_type":"image/png","created_at":"2025-01-17T16:12:32.693+00:00","height":500,"width":500,"storage_key":"a10cec9f-2e07-4f02-8260-58fe96fe1a37","context":"documentation","original_url":"https://d1iv7db44yhgxn.cloudfront.net/documentation/images/a10cec9f-2e07-4f02-8260-58fe96fe1a37/engagement-topic.png"},"application_families":["fortnite"],"blocks":[{"type":"paragraph","content":"Engagement payouts proportionally distribute a percentage of the net revenue from Fortnite’s Item Shop and most real-money purchases to all island publishers on a monthly basis. Payouts are based on what players enjoy in Fortnite, and account for island popularity, engagement, attracting new players, and other measurements described below.","settings":{"is_hidden":false}},{"type":"callout","callout_type":"note","blocks":[{"type":"paragraph","content":"We will continue to update the metrics that calculate engagement payouts to account for the current state of tools in both Fortnite’s developer ecosystem and our roadmap.","settings":{"is_hidden":false}}],"settings":{"is_hidden":false}},{"type":"paragraph","content":"Epic’s existing \u003Ca href=\"https://dev.epicgames.com/documentation/en-us/fortnite/sac\">Support-A-Creator (SAC)\u003C/a> program is separate from the Engagement Payout program.","settings":{"is_hidden":false}},{"type":"paragraph","content":"The calculation of your island’s engagement will be determined for the calendar month, which means from the first of the month to the end. Payouts occur \u003Cb>30 days\u003C/b> after the end of the calendar month. ","settings":{"is_hidden":false}},{"type":"paragraph","content":"Engagement payouts are available to developers 18 years of age and older.","settings":{"is_hidden":false}},{"type":"header","content":"Program Requirements","level":2,"settings":{"is_hidden":false,"anchor_id":4760,"anchor":{"id":4760,"name":"program-requirements"}}},{"type":"paragraph","content":"To be eligible for engagement payouts, you must meet one of the following criteria.","settings":{"is_hidden":false}},{"type":"paragraph","content":"\u003Cb>Make a purchase through Epic Payments\u003C/b>","settings":{"is_hidden":false}},{"type":"paragraph","content":"Qualifying purchases include real money purchases made in the last 365 days on:","settings":{"is_hidden":false}},{"type":"enhanced_list","style":"unordered","items":[[{"type":"paragraph","content":"\u003Ca href=\"https://store.epicgames.com/\">Epic Games Store\u003C/a>","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"\u003Ca href=\"https://www.fab.com/\">Fab.com\u003C/a>","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"\u003Ca href=\"https://www.fortnite.com/\">Fortnite.com\u003C/a>","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Fortnite on PC","settings":{"is_hidden":false}}]],"settings":{"is_hidden":false}},{"type":"paragraph","content":"Any real-money purchase made through Epic Payments in the last 365 days qualifies.  Gift card balance and Epic Account balance purchases \u003Cb>do not\u003C/b> qualify.","settings":{"is_hidden":false}},{"type":"enhanced_list","style":"unordered","items":[[{"type":"paragraph","content":"Spend and redeem $20 in Fortnite.","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Spend and redeem at least $20 in Fortnite in the last 365 days on any platform. ","settings":{"is_hidden":false}},{"type":"paragraph","content":"Purchases in game and on Fortnite.com qualify.","settings":{"is_hidden":false}}]],"settings":{"is_hidden":false}},{"type":"paragraph","content":"You or the legal entity’s representative must be at least 18 years old. ","settings":{"is_hidden":false}},{"type":"paragraph","content":"You must abide by the \u003Ca href=\"https://www.fortnite.com/news/fortnite-island-creator-rules\">Fortnite Developer Rules\u003C/a>.  ","settings":{"is_hidden":false}},{"type":"paragraph","content":"If you meet the requirements above, you can enroll in the Engagement Payout program and contribute to the Fortnite ecosystem.","settings":{"is_hidden":false}},{"type":"paragraph","content":"When you’re accepted into the program, you’ll see new engagement and payout data in the Monetization Payout tab of Creator Portal where you track your payouts.","settings":{"is_hidden":false}},{"type":"header","content":"How It Works: The Engagement Pool&nbsp;","level":2,"settings":{"is_hidden":false,"anchor_id":19903,"anchor":{"id":19903,"name":"nbsp-how-it-works-the-engagement-pool-nbsp"}}},{"type":"paragraph","content":"Fortnite developers enrolled in the Engagement Payout program receive payouts based on player engagement in their islands. Forty percent of the eligible net revenue from Fortnite’s Item Shop and related real-money purchases is placed into an Engagement Pool, which is distributed among developers' and Epic's islands based on the Engagement Payout Formula. ","settings":{"is_hidden":false}},{"type":"paragraph","content":"This net revenue is the value of all eligible V-Bucks spending and real money purchases, adjusted for applicable taxes and third-party fees that are deducted by Nintendo, PlayStation, Xbox, and other sellers of Fortnite before they transfer funds to Epic. Where Epic processes payments directly (such as on Windows and certain mobile devices), only third-party payment processing fees (such as credit card processing and PayPal fees) are deducted.","settings":{"is_hidden":false}},{"type":"paragraph","content":"Once that amount has been determined, we reserve 60% of it to fund Epic’s ongoing operations and Fortnite ecosystem development. These expenditures include:","settings":{"is_hidden":false}},{"type":"enhanced_list","style":"unordered","items":[[{"type":"paragraph","content":"Core ecosystem software and service development","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Shared game art","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Cosmetic creation, merchandising, and third-party IP licensing fees","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"IT, hosting, and liveops infrastructure","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Player acquisition, marketing, and distribution","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Customer support","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Content moderation","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Affiliate Support-A-Creator payments","settings":{"is_hidden":false}}]],"settings":{"is_hidden":false}},{"type":"paragraph","content":"In addition to 40% of eligible net revenue, 50% of sponsorship revenue generated by \u003Ca data-document-id=\"4596399\" href=\"https://dev.epicgames.com/documentation/fortnite/campaigns-in-fortnite\">Sponsored Row campaigns\u003C/a> will go into the engagement payout pool, boosting the pool size for all developers. From the launch of this feature through the end of 2026, this rate will be 100%.","settings":{"is_hidden":false}},{"type":"header","content":"How It Works: Engagement Payout Formula","level":2,"settings":{"is_hidden":false,"anchor_id":19904,"anchor":{"id":19904,"name":"how-it-works-engagement-payout-formula"}}},{"type":"paragraph","content":"The goal of engagement payouts is to compensate island developers for the value they bring to Fortnite through engagement, as measured by island engagement metrics from Fortnite players who have made a real money purchase on their accounts. This includes all Fortnite players who have ever purchased V-Bucks Packs or retail V-Bucks gift cards, completed real money transactions like Starter Packs or Quest Packs, subscribed to Fortnite Crew, or purchased Save the World.","settings":{"is_hidden":false}},{"type":"paragraph","content":"Engagement from these players is measured in the following metrics, which make up the Engagement Payout Formula:","settings":{"is_hidden":false}},{"type":"enhanced_table","widths":null,"rows":[[[{"type":"paragraph","content":"Active Playtime","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Active time players spend on your island.","settings":{"is_hidden":false}}]],[[{"type":"paragraph","content":"\u003Cb>Island Retention\u003C/b>","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Players returning to your island on subsequent days after playing it.","settings":{"is_hidden":false}}]],[[{"type":"paragraph","content":"\u003Cb>Playtime Surrounding Item Shop V-Bucks Spend\u003C/b>","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"Active time within a week (before and after) a player spent V-Bucks in the Item Shop.","settings":{"is_hidden":false}}]],[[{"type":"paragraph","content":"\u003Cb>User Acquisition Rewards: New Players\u003C/b>","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"When a player comes to Fortnite for the very first time to play your island, you receive 75% of that player’s contributions to the Engagement Pool for the next six months. These contributions are the value of that player’s V-Bucks spending in the Item Shop.","settings":{"is_hidden":false}}]],[[{"type":"paragraph","content":"\u003Cb>User Acquisition Rewards: Returning Players\u003C/b>","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"When a player who has not played Fortnite in over six months returns to play your island, you receive 75% of that player’s contributions to the Engagement Pool for the next six months. These contributions are the value of that player’s V-Bucks spending in the Item Shop.","settings":{"is_hidden":false}}]]],"settings":{"is_hidden":false}},{"type":"paragraph","content":"If your island was a Brand Island when a player was attributed to it, the IP partner receives the portion of engagement payout defined in the \u003Ca href=\"https://create.fortnite.com/news/ip-partner-fee-schedule\">Fee Schedule\u003C/a> for that player — even if you later stop using that brand in your island.","settings":{"is_hidden":false}},{"type":"paragraph","content":"Attribution for new and lapsed players is determined as follows: ","settings":{"is_hidden":false}},{"type":"enhanced_list","style":"unordered","items":[[{"type":"paragraph","content":"\u003Cb>In-game search and direct links\u003C/b>: Players who reach their first island by searching for it or via \u003Ca data-document-id=\"3940452\" href=\"https://dev.epicgames.com/documentation/fortnite/links-in-fortnite-creative\">direct link\u003C/a> are fully attributed to that island.","settings":{"is_hidden":false}}],[{"type":"paragraph","content":"\u003Cb>First-day playtime\u003C/b>: Players who reach their first island via Discover (not search or direct links) will have their engagement pool contributions divided among the islands they play on their first day, based on the percentage of time played per island.","settings":{"is_hidden":false}}]],"settings":{"is_hidden":false}},{"type":"paragraph","content":"Currently, attribution through links is supported for new players on PC, and for returning players on PC and mobile. Attribution through links is not supported for players in the European Union. Attribution from other methods is supported on all platforms and regions.","settings":{"is_hidden":false}},{"type":"paragraph","content":"For information on the analytics and metrics for engagement payouts and other forms of monetization, see \u003Ca data-document-id=\"4597419\" href=\"https://dev.epicgames.com/documentation/fortnite/account-level-monetization-in-fortnite\">Account Level Monetization\u003C/a>.","settings":{"is_hidden":false}}],"applications":[{"id":4279148,"type":"fortnite","version":"1.0","major_version":"1"}],"tags":["information","publish","promote"],"banner_image":{"id":23215301,"file_name":"engagement-hero.png","file_size":173694,"content_type":"image/png","created_at":"2025-01-17T16:12:33.489+00:00","height":335,"width":1920,"storage_key":"1b9de4e1-33ec-402a-9b92-5fe55ac53a1f","context":"documentation"},"prereq_documents":[],"related_documents":[]},"h":{},"s":200,"st":"OK","u":"http://documentation-app/community/api/documentation/document.json","rt":"json"},"__nghData__":[{"t":{"0":"t1","1":"t11"},"c":{"0":[{"i":"t1","r":10,"t":{"0":"t2","1":"t3","2":"t4","3":"t5","4":"t6","5":"t7","6":"t8","7":"t9","8":"t10"},"c":{"0":[],"1":[{"i":"t3","r":1}],"2":[],"3":[],"4":[],"5":[],"6":[],"7":[],"8":[]}}],"1":[]}},{"c":{"4":[]}},{},{"t":{"0":"t16","1":"t17","2":"t18","3":"t19","5":"t23","7":"t21","9":"t24"},"c":{"0":[{"i":"t16","r":1}],"1":[],"2":[],"3":[{"i":"t19","r":1,"t":{"4":"t20"},"c":{"4":[{"i":"t21","r":1,"t":{"1":"t22"},"c":{"1":[]}}]}}],"5":[],"7":[],"9":[]}},{"t":{"0":"t12"},"c":{"0":[{"i":"t12","r":1,"t":{"5":"t13"},"c":{"5":[{"i":"t13","r":1,"t":{"1":"t14"},"c":{"1":[{"i":"t15","r":1}]}}]}}]}},{"t":{"1":"t25","2":"t26","4":"t27","8":"t28","12":"t30","13":"t31","14":"t32","15":"t135","16":"t136","17":"t15"},"c":{"1":[],"2":[{"i":"t26","r":1}],"4":[],"8":[{"i
