const PIN=(tl,p,a)=>{tl.fromTo(p,{'--cp':100,opacity:1},{'--cp':0,duration:.62,ease:'power2.inOut'},a-.2);tl.fromTo(p,{filter:'brightness(1.8) saturate(1.4)'},{filter:'brightness(1) saturate(1)',duration:.7,ease:'power2.out'},a-.2);},POUT=(tl,p,b)=>{tl.to(p,{keyframes:[{skewX:1.6,scaleY:1.01,filter:'blur(1.5px) brightness(1.25)',duration:.09},{skewX:-1.8,filter:'blur(3px) brightness(1.45)',duration:.09},{skewX:1.2,filter:'blur(5px) brightness(1.7)',duration:.08},{skewX:0,y:-26,opacity:0,filter:'blur(12px) brightness(2)',duration:.12}],ease:'none'},b-.38);};
document.querySelectorAll('#root .p').forEach(p=>{
  const first=p.dataset.first==='1';
  const a=p.dataset.in==='@0'?0:(AT[p.dataset.in]??K[p.dataset.in]);

  tl.set(p,{visibility:'visible'},first?0:Math.max(0,a-.14));
  if(first)tl.set(p,{opacity:1},0);else PIN(tl,p,a);
  POUT(tl,p,b);
  tl.set(p,{visibility:'hidden'},b+.04);
});
gsap.set('#outro',{clipPath:'inset(0 0 100% 0)'});tl.to('#outro',{clipPath:'inset(0 0 0% 0)',duration:.75,ease:'power2.inOut'},OUT-.15);
// counters: <b class="ct" data-from data-to data-a data-b data-dec>
const cts=[...document.querySelectorAll('.ct')].map(e=>({e,from:+e.dataset.from||0,to:+e.dataset.to,a:AT[e.dataset.a]??K[e.dataset.a],d:+e.dataset.d||1,dec:+e.dataset.dec||0,pre:e.dataset.pre||'',suf:e.dataset.suf||''}));
const fmt=(v,d)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const eout=(x)=>x<=0?0:x>=1?1:1-Math.pow(1-x,3);
const grain=q('#grain');
let draw=null,last=0;
const HUD=(t)=>{const sm=(a,b)=>{const x=Math.min(1,Math.max(0,(t-a)/(b-a)));return x*x*(3-2*x);};
const bi=document.getElementById('bIron'),bh=document.getElementById('bHeat'),bc=document.getElementById('bCu');if(!bi)return;
bi.style.transform='scaleX('+sm(AT['s6:Bawakan']+.3,AT['s6:gunung']+.25)+')';

bc.style.transform='scaleX('+sm(AT['s6:tembaga']-.1,K.s7+1.8)+')';};
function all(t){last=t;for(const c of cts)c.e.textContent=c.pre+fmt(c.from+(c.to-c.from)*eout((t-c.a)/c.d),c.dec)+c.suf;
 const g=Math.floor(t*12);grain.style.transform='translate3d('+(-((g*37)%100))+'px,'+(-((g*61)%100))+'px,0)';HUD(t);if(draw)draw(t);}
const c={t:0};
tl.to(c,{t:DUR,duration:DUR,ease:'none',onUpdate:()=>all(c.t)},0);
window.addEventListener('hf-seek',e=>all(e.detail.time));
all(0);
window.__hf=window.__hf||{};window.__hf.buildReady=window.__hf.buildReady||{};
window.__hf.buildReady.world3d=import('./assets/lib/world3d.js').then(m=>{draw=m.create(q('#gl'),K,AT);draw(last);});
window.__timelines["world"]=tl;
})();
