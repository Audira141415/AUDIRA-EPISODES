<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>AUDIRA TECH: How It Works</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background-color: #0A0D14;
      font-family: 'JetBrains Mono', monospace;
      color: #FFFFFF;
      overflow: hidden;
      position: relative;
    }
    #viewport {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .hud-header {
      position: absolute;
      top: 160px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 242, 254, 0.3);
      padding-bottom: 12px;
      z-index: 10;
    }
    .hud-title {
      font-size: 20px;
      color: #00F2FE;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .hud-rec {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #FF3366;
    }
    .rec-dot {
      width: 8px;
      height: 8px;
      background: #FF3366;
      border-radius: 50%;
      box-shadow: 0 0 8px #FF3366;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div class="hud-header">
      <div class="hud-title">AUDIRA TECH // HOW IT WORKS</div>
      <div class="hud-rec"><span class="rec-dot"></span> REC LIVE TELEMETRY</div>
    </div>
    <div id="scenes-container"></div>
  </div>
</body>
</html>
