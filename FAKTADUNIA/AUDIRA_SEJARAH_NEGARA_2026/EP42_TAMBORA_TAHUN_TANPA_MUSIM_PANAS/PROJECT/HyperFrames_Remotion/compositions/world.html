 stamp:(e,t)=>tl.fromTo(e,{scale:1.9,rotation:-7,opacity:0},{scale:1,rotation:-3,opacity:1,duration:.2,ease:'power4.in'},t),
 card:(e,t)=>{tl.fromTo(e,{opacity:0,y:34},{opacity:1,y:0,duration:.42,ease:'power3.out',immediateRender:false},t);},
 stampc:(e,t)=>{tl.fromTo(e,{scale:1.35,opacity:0},{scale:1,opacity:1,duration:.26,ease:'power3.out',immediateRender:false},t);},
 ring:(e,t)=>{tl.fromTo(e,{scale:.05,opacity:0},{scale:1,opacity:1,duration:.9,ease:'power2.out',immediateRender:false},t-.1);const w=q('#ripple .wv');tl.fromTo(w,{scale:.4,opacity:.95},{scale:(+e.getAttribute('r'))/40*1.12,opacity:0,duration:1.0,ease:'power1.out',immediateRender:false},t-.15);},
 pin:(e,t)=>{tl.fromTo(e,{opacity:0,y:(e.classList.contains('hi')?-14:14),scale:.7},{opacity:1,y:0,scale:1,duration:.38,ease:'back.out(2)',immediateRender:false},t+.25);},
};
document.querySelectorAll('#root [data-at]').forEach(e=>{
  const f=FX[e.dataset.fx||'up'];const a=AT[e.dataset.at];
  if(e.dataset.fx==='grow')gsap.set(e,{scaleX:0});else if(e.dataset.fx==='growy')gsap.set(e,{scaleY:0});else gsap.set(e,{opacity:0});
  f(e,a);
});
const PIN=(tl,p,a)=>tl.fromTo(p,{opacity:0,y:40},{opacity:1,y:0,duration:.42,ease:'power3.out'},a-.02),POUT=(tl,p,b)=>tl.to(p,{opacity:0,y:-30,duration:.24,ease:'power2.in'},b-.24);
document.querySelectorAll('#root .p').forEach(p=>{
  const first=p.dataset.first==='1';
  const a=p.dataset.in==='@0'?0:(AT[p.dataset.in]??K[p.dataset.in]);
  const b=p.dataset.out==='@END'?OUT-.1:(AT[p.dataset.out]??K[p.dataset.out]);
  gsap.set(p,{visibility:'hidden',opacity:0});
  tl.set(p,{visibility:'visible'},first?0:Math.max(0,a-.14));
  if(first)tl.set(p,{opacity:1},0);else PIN(tl,p,a);
  POUT(tl,p,b);
  tl.set(p,{visibility:'hidden'},b+.04);
});
gsap.set('#outro',{opacity:0});tl.to('#outro',{opacity:1,duration:.3,ease:'power2.out'},OUT);
// counters: <b class="ct" data-from data-to data-a data-b data-dec>
const cts=[...document.querySelectorAll('.ct')].map(e=>({e,from:+e.dataset.from||0,to:+e.dataset.to,a:AT[e.dataset.a]??K[e.dataset.a],d:+e.dataset.d||1,dec:+e.dataset.dec||0,pre:e.dataset.pre||'',suf:e.dataset.suf||''}));
const fmt=(v,d)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const eout=(x)=>x<=0?0:x>=1?1:1-Math.pow(1-x,3);
const grain=q('#grain');
let draw=null,last=0;
const HUD=(t)=>{const cs=["s2","s2:Dentumannya-0.3","s3","s5:Gas-0.35","s6","s6:Di-0.2","s7","s8"].map(k=>AT[k]??K[k]);let k=0;for(const c of cs){const d=Math.abs(t-c);if(d<0.32)k=Math.max(k,1-Math.pow(d/0.32,2));}q('#ash').style.opacity=k.toFixed(3);
   const pn=document.querySelectorAll('#ripple .pin');const w=AT['s8:Satu'];pn.forEach((p,i)=>{const d=t-(w+0.5+i*0.12);p.style.filter=(d>0&&d<0.5)?'brightness(1.25)':'none';});};
const SIG=(function(){const e=q('#sig');if(!e)return null;const P=[[690,1200],[60,1200],[700,660],[60,930],[640,240],[380,1120]];let h=0;for(const ch of "EP42_TAMBORA_TAHUN_TANPA_MUSIM_PANAS")h=(h*31+ch.charCodeAt(0))>>>0;const ord=P.map((p,i)=>[p,(h>>>(i*3))%97+i]).sort((x,y)=>x[1]-y[1]).map(x=>x[0]);return (t)=>{const k=Math.floor(t/18)%ord.length;e.style.transform='translate('+ord[k][0]+'px,'+ord[k][1]+'px)';e.style.visibility=t>=OUT?'hidden':'visible';};})();
function all(t){last=t;for(const c of cts)c.e.textContent=c.pre+fmt(c.from+(c.to-c.from)*eout((t-c.a)/c.d),c.dec)+c.suf;
 const g=Math.floor(t*12);grain.style.transform='translate3d('+(-((g*37)%100))+'px,'+(-((g*61)%100))+'px,0)';HUD(t);if(SIG)SIG(t);if(draw)draw(t);}
const c={t:0};
tl.to(c,{t:DUR,duration:DUR,ease:'none',onUpdate:()=>all(c.t)},0);
window.addEventListener('hf-seek',e=>all(e.detail.time));
all(0);
window.__hf=window.__hf||{};window.__hf.buildReady=window.__hf.buildReady||{};
window.__hf.buildReady.world3d=import('./assets/lib/world3d.js').then(m=>{draw=m.create(q('#gl'),K,AT);draw(last);});
window.__timelines["world"]=tl;
})();
